name: Apply doodle motion patch

on:
  push:
    branches: [telegram-glass-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram-glass-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/upgrade-doodle-motion.py
      - name: Commit generated plugin
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin.js
          git commit -m 'feat: make doodles independently drift'
          git push origin HEAD:telegram-glass-v2
